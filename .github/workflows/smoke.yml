name: test

# Runs the Playwright suites (app, health, regressions, security,
# accessibility, typography) against index.html in headless Chromium.
# Two timezones, since several past bugs only showed up away from UTC.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Pacific/Auckland]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
